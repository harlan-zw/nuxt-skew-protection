blockExoticSubdeps: false

minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - '@nuxt/kit@4.6.0'
  - '@nuxt/nitro-server@4.6.0'
  - '@nuxt/schema@4.6.0'
  - '@nuxt/vite-builder@4.6.0'
  - nuxt@4.6.0
  - '@nuxt/cli@4.0.0'
  - '@nuxt/vite-server@4.6.0'

trustLockfile: true
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 262800

trustPolicyExclude:
  - stylehacks@9.0.7
  - postcss-normalize-timing-functions@9.0.5
  - postcss-normalize-display-values@9.0.5
  - postcss-normalize-repeat-style@9.0.5
  - postcss-normalize-positions@9.0.6
  - postcss-normalize-whitespace@9.0.5
  - postcss-minify-font-values@9.0.7
  - postcss-discard-overridden@9.0.5
  - postcss-discard-duplicates@9.0.5
  - postcss-reduce-transforms@9.0.4
  - postcss-normalize-unicode@9.0.5
  - postcss-normalize-charset@9.0.5
  - postcss-unique-selectors@9.0.5
  - postcss-normalize-string@9.0.5
  - postcss-minify-selectors@9.0.6
  - postcss-minify-gradients@9.0.6
  - postcss-discard-comments@9.0.6
  - postcss-reduce-initial@9.0.6
  - postcss-ordered-values@9.0.6
  - postcss-merge-longhand@9.2.0
  - postcss-convert-values@9.0.7
  - postcss-normalize-url@9.0.5
  - postcss-minify-params@9.0.6
  - postcss-merge-rules@9.0.8
  - postcss-discard-empty@9.0.5
  - postcss-colormin@9.0.6
  - cssnano-utils@8.1.0
  - postcss-svgo@9.0.4
  - cssnano@9.2.2
  - cssnano-preset-default@9.2.2

shellEmulator: true

packages:
  - playground
  - devtools
  - test/fixtures/*
  - '!test/fixtures/nuxt5'

# Local migration proof overrides
overrides:
  '@nuxtjs/robots': https://pkg.pr.new/nuxt-modules/robots/@nuxtjs/robots@24f4dcdbf3cd8d4c19a210b62eec8295eb4772a7
  '@nuxtjs/sitemap': https://pkg.pr.new/nuxt-modules/sitemap/@nuxtjs/sitemap@7879681b68064274eea0be819003669b9422b60d
  nuxt-site-config: https://pkg.pr.new/harlan-zw/nuxt-site-config/nuxt-site-config@59e27b8dc55b21407ce19dfdbb7be0c6571e9490
  nuxt-site-config-kit: https://pkg.pr.new/harlan-zw/nuxt-site-config/nuxt-site-config-kit@59e27b8dc55b21407ce19dfdbb7be0c6571e9490
  nuxtseo-shared: https://pkg.pr.new/harlan-zw/nuxt-seo/nuxtseo-shared@226c091a0744b7286ef721ac035eed53856bfaa5
  site-config-stack: https://pkg.pr.new/harlan-zw/nuxt-site-config/site-config-stack@59e27b8dc55b21407ce19dfdbb7be0c6571e9490

allowBuilds:
  '@firebase/util': false
  '@parcel/watcher': true
  better-sqlite3: true
  esbuild: true
  protobufjs: false
  sharp: true
  simple-git-hooks: false
  unrs-resolver: false
  vue-demi: true
  workerd: true

onlyBuiltDependencies:
  - '@firebase/util'
  - '@parcel/watcher'
  - better-sqlite3
  - esbuild
  - protobufjs
  - unrs-resolver
  - vue-demi
  - workerd

