name: CI

on:
  # No paths-ignore: reusable-ci.yml skips its jobs when only docs change, so
  # their checks still report.
  push:
    branches:
      - main
  # Every base, so stacked pull requests are tested too.
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: harlan-zw/nuxt-seo/.github/workflows/reusable-ci.yml@main
    with:
      redis: true
      paths-ignore: '**/README.md'
