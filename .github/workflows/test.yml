name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/README.md'
  # Every base, so stacked pull requests are tested too.
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    strategy:
      matrix:
        node-version: [22.22.3, 24.18.0]
    uses: harlan-zw/nuxt-seo/.github/workflows/reusable-ci.yml@main
    with:
      node-version: ${{ matrix.node-version }}
      redis: true
